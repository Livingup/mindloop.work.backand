# spread-ai 首次运行自动生成的默认用户配置
#
# 该配置面向发布态 CLI 使用，默认存放于 ~/.spread-ai/agent_runtime.yaml。
# 默认值以“本地可运行”为目标，不强制依赖云对象存储凭证。

agent_runtime_service:
  service_instance_name: "spread-ai-local"
  service_environment: "local"
  service_host: "0.0.0.0"
  service_port: 8000

file_resource_service:
  file_resource_batch_limit: 20
  local_resource_storage_root_path: "~/.spread-ai/file-resource"
  object_storage_gateway_provider: "memory"
  object_storage_gateway:
    gateway_provider: "memory"
    object_storage_endpoint: ""
    object_storage_region: ""
    object_storage_bucket_name: ""
    object_storage_public_base_url: "http://127.0.0.1:8000/file-resource"
    object_storage_object_key_prefix: "agent-runtime/file-resource"
    object_storage_access_key_id: ""
    object_storage_access_key_secret: ""
    connect_timeout_seconds: 10

conversation_repository:
  data_dir: "~/.spread-ai/conversations"

prompt_template:
  snippets_dir: "~/.spread-ai/prompt-snippets"

skill_service:
  skills_dir: "~/.spread-ai/skills"

mcp_client:
  config_dir: "~/.spread-ai/mcp-servers"

agent_definition:
  definitions_dir: "~/.spread-ai/agents"

llm_model_registry:
  registry_dir: "~/.spread-ai/llm-model-registry"
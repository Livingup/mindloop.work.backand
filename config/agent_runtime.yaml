# 通用 Agent 运行时环境服务配置
#
# 该配置文件用于承载当前项目的运行时基础配置。
# 当前先落统一文件资源服务相关配置，同时保留整个运行时服务自己的宿主配置。

agent_runtime_service:
  # 当前运行时服务实例名称，用于区分不同部署环境或不同节点。
  service_instance_name: "${SPREAD_AI_SERVICE_INSTANCE_NAME:-agent-runtime-local}"

  # 当前运行时服务环境标识，可选值可继续扩展为 local / dev / test / prod。
  service_environment: "${SPREAD_AI_SERVICE_ENVIRONMENT:-local}"

  # API 监听地址（bind address），决定后端进程把 API 绑定到这台电脑的哪个网络入口：
  # - 127.0.0.1：只给本机前端/本机脚本访问。
  # - 0.0.0.0：允许通过本机所有网卡访问，例如本机、局域网 IP、Docker 容器网络。
  # 该字段不填写远端机器地址，也不是权限白名单。
  service_host: "${SPREAD_AI_SERVICE_HOST:-127.0.0.1}"

  # 当前运行时服务监听端口。
  service_port: "${SPREAD_AI_SERVICE_PORT:-8000}"

file_resource_service:
  # 统一文件资源服务单次批量处理上限。
  file_resource_batch_limit: 20

  # 统一文件资源服务本地热存储根目录。
  local_resource_storage_root_path: "~/.spread-ai/file-resource"

  # 当前统一文件资源服务使用的对象存储南向网关实现。
  # 当前服务配置使用 aliyun_oss，把文件上传到阿里云 OSS 并返回 OSS 外链。
  object_storage_gateway_provider: "aliyun_oss"

  object_storage_gateway:
    # 对象存储服务提供商。
    gateway_provider: "aliyun_oss"

    # 阿里云 OSS endpoint。
    object_storage_endpoint: "https://oss-cn-hongkong.aliyuncs.com"

    # 对象存储区域，应选择国内外模型服务都能稳定读取资源的区域，并与 Endpoint/Bucket 实际地域一致。
    object_storage_region: "cn-hongkong"

    # 对象存储桶名称。
    object_storage_bucket_name: "agent-runtime-resources"

    # 资源上传到对象存储后返回给前端/模型访问的公共 URL 前缀。
    object_storage_public_base_url: "https://agent-runtime-resources.oss-cn-hongkong.aliyuncs.com/agent-runtime/file-resource"

    # 对象存储对象键前缀，用于统一文件资源服务在桶内做业务隔离。
    object_storage_object_key_prefix: "agent-runtime/file-resource"

    # 阿里云 OSS AccessKey ID（从环境变量读取）。
    object_storage_access_key_id: "${OSS_ACCESS_KEY_ID}"

    # 阿里云 OSS AccessKey Secret（从环境变量读取）。
    object_storage_access_key_secret: "${OSS_ACCESS_KEY_SECRET}"

    # 对象存储连接超时时间（秒）。
    connect_timeout_seconds: 10

conversation_repository:
  # 会话数据存储根目录（SQLite 元数据 + JSONL 消息文件）。
  data_dir: "~/.spread-ai/conversations"

agent_runtime:
  # Agent 任务、实例和父子关系运行态仓储类型。sqlite 支持本机多 worker / 多进程共享。
  repository_type: "sqlite"

  # Agent 运行态 SQLite 数据目录。
  data_dir: "~/.spread-ai/agent-runtime"

  # 每个 Agent 实例会将自己的对话执行过程保存为 Markdown trace 文件。
  trace_dir: "~/.spread-ai/agent-traces"

communication:
  # 通用通信流与消息日志 SQLite 数据目录。
  data_dir: "~/.spread-ai/communication"

scene:
  # 全局 Scene SQLite 数据库文件路径。所有 workspace 共享该数据库，每条 scene 通过 project_id 归属到项目。
  scenes_db_path: "~/.spread-ai/scene/scene.db"
  # 全局最近工作区索引文件路径，前端"最近项目"列表展示用，丢失或损坏不影响业务（项目身份与 scene 数据完整保留）。
  recent_workspaces_path: "~/.spread-ai/recent-workspaces.json"

prompt_template:
  # 提示词片段 YAML 文件存储根目录。
  snippets_dir: "~/.spread-ai/prompt-snippets"

skill_service:
  # Skill 仓库根目录。
  skills_dir: "C:/skills"

mcp_client:
  # MCP 服务配置 YAML 文件存放目录，每个 YAML 文件对应一个可连接的 MCP 服务。
  config_dir: "~/.spread-ai/mcp-servers"

agent_definition:
  # Agent 定义 YAML 文件存放目录（每个 Agent 定义一个 YAML 文件，文件名即 agent_id）。
  definitions_dir: "~/.spread-ai/agents"

llm_model_registry:
  # LLM 模型注册 SQLite 数据库所在根目录。运行期权威数据文件为 llm_model_registry.sqlite3。
  # legacy YAML 只作为一次性迁移输入，不会在应用启动或仓储初始化时自动导入。
  registry_dir: "~/.spread-ai/llm-model-registry"

llm_http_trace:
  enabled: true
  data_dir: "~/.spread-ai/llm-http-traces"
  max_body_bytes: 20971520

context_compression:
  enabled: true
  default_threshold_ratio: 0.75
  max_worker_rounds: 128
  input_mode: "transcript_snapshot"
  verifier_enabled: false
  archive_data_dir: "~/.spread-ai/context-compression"


lacp:
  data_dir: "~/.spread-ai/lacp"
  connect_timeout_seconds: 10
  request_timeout_seconds: 5
  reconnect_initial_delay_seconds: 1
  reconnect_max_delay_seconds: 30

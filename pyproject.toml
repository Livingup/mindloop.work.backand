[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "通用 Agent 运行时环境服务"
readme = "doc/统一文件资源管理服务.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0,<11.0.0",
  "pypdf>=4.0.0,<5.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "oss2>=2.18.0,<3.0.0",
  "watchdog>=4.0.0,<6.0.0",
  "click>=8.1.0,<9.0.0",
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "openai>=2.30.0,<3.0.0",
  "anthropic>=0.90.0,<1.0.0",
  "google-genai>=1.70.0,<2.0.0",
  "mcp>=1.25.0,<2.0.0",
]

[project.scripts]
spread-ai = "agent_runtime.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

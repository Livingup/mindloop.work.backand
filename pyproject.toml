[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "通用 Agent 运行时环境服务"
readme = "doc/统一文件资源管理服务.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0,<11.0.0",
  "pypdf>=4.0.0,<5.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "oss2>=2.18.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
